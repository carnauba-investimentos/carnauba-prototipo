<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnaúba — Cronograma</title>
  <link rel="stylesheet" href="design-system/colors_and_type.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-body);
      background: var(--color-gray-100);
      color: var(--color-navy);
      font-size: var(--text-sm);
      line-height: var(--leading-normal);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Inputs ── */
    input, textarea, select {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      background: var(--color-white);
      border: 1px solid var(--color-gray-200);
      border-radius: var(--radius-md);
      padding: 7px 10px;
      color: var(--color-navy);
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      width: 100%;
    }
    input:focus, textarea:focus {
      border-color: var(--color-blue);
      box-shadow: 0 0 0 3px rgba(115,169,199,0.18);
    }
    input[type="checkbox"] {
      width: 15px; height: 15px; accent-color: var(--color-navy); cursor: pointer;
    }
    input[type="number"] { -moz-appearance: textfield; font-family: var(--font-mono); }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input:disabled, textarea:disabled {
      background: transparent; border-color: transparent;
      color: var(--color-navy); cursor: default; padding-left: 0;
    }
    textarea { resize: vertical; min-height: 52px; line-height: var(--leading-normal); }
    .input-spent::placeholder { color: var(--color-success); opacity: 0.7; }
    .input-spent-warn::placeholder { color: var(--color-warning); opacity: 0.8; }
    input[type="date"] { font-family: var(--font-mono); font-size: 12px; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-gray-200); border-radius: 99px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 16px; border-radius: var(--radius-md);
      border: none; font-family: var(--font-body);
      font-size: var(--text-sm); font-weight: var(--weight-medium);
      cursor: pointer; transition: all var(--transition-fast);
      white-space: nowrap; line-height: 1;
    }
    .btn-primary {
      background: var(--color-navy); color: var(--color-white);
    }
    .btn-primary:hover { background: var(--color-navy-90); box-shadow: var(--shadow-md); }
    .btn-primary:active { background: var(--color-gray-800); }
    .btn-ghost {
      background: transparent; color: var(--color-gray-600);
      border: 1px solid var(--color-gray-200);
    }
    .btn-ghost:hover {
      background: var(--color-gray-100); color: var(--color-navy);
      border-color: var(--color-gray-400);
    }
    .btn-sm { padding: 5px 10px; font-size: var(--text-xs); }

    /* ── Field groups ── */
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group > label {
      font-size: var(--text-xs); font-weight: var(--weight-medium);
      color: var(--color-gray-600); text-transform: uppercase;
      letter-spacing: var(--tracking-wide); font-family: var(--font-display);
    }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--color-gray-200); }

    /* ── Mono ── */
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ── Tooltip ── */
    .budget-tooltip {
      position: absolute; bottom: calc(100% + 8px); left: 50%;
      transform: translateX(-50%);
      background: var(--color-gray-800); color: var(--color-white);
      border-radius: var(--radius-md); padding: 10px 14px;
      font-size: var(--text-xs); white-space: nowrap;
      box-shadow: var(--shadow-lg); z-index: 200;
      pointer-events: none;
    }
    .budget-tooltip::after {
      content: ''; position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: var(--color-gray-800);
    }

    @keyframes slideInRight {
      from { transform: translateX(48px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes fadeInBg {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes popIn {
      from { transform: translateY(8px) scale(0.97); opacity: 0; }
      to   { transform: translateY(0)   scale(1);    opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react-beautiful-dnd@13.1.1/dist/react-beautiful-dnd.min.js" crossorigin="anonymous"></script>
  <script type="text/babel" src="cronograma-itens.jsx"></script>
  <script type="text/babel" src="item-modal.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
